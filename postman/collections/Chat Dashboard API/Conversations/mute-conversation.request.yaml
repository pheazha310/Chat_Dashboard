$kind: http-request
name: 'Mute Conversation'
method: PUT
url: '{{base_url}}/api/v1/admin/conversations/:id/mute'
order: 9000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "muted": true
    }
