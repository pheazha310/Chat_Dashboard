$kind: http-request
name: 'Change Conversation Status'
method: PATCH
url: '{{base_url}}/api/v1/admin/conversations/:id/status'
order: 5000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "closed"
    }
