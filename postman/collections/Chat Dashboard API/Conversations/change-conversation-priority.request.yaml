$kind: http-request
name: 'Change Conversation Priority'
method: PATCH
url: '{{base_url}}/api/v1/admin/conversations/:id/priority'
order: 6000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "priority": "high"
    }
