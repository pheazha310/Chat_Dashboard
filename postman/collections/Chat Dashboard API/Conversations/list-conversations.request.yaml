$kind: http-request
name: 'List Conversations'
method: GET
url: '{{base_url}}/api/v1/admin/conversations'
order: 1000
queryParams:
  - key: status
    value: open
    description: 'Filter by status (open, closed, archived)'
    disabled: true
  - key: assignedTo
    value: ''
    description: Filter by assigned agent ID
    disabled: true
  - key: page
    value: '1'
    description: Page number
    disabled: true
  - key: limit
    value: '20'
    description: Items per page
    disabled: true
