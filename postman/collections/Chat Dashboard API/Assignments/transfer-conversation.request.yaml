$kind: http-request
name: 'Transfer Conversation'
method: POST
url: '{{base_url}}/api/v1/admin/conversations/:id/transfer'
order: 2000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "agentId": "agent-uuid-here"
    }
