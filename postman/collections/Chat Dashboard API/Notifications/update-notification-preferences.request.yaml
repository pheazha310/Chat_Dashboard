$kind: http-request
name: 'Update Notification Preferences'
method: PUT
url: '{{base_url}}/api/v1/admin/notifications/preferences'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": true,
      "push": true,
      "sound": false
    }
