$kind: http-request
name: 'Update Canned Response'
method: PATCH
url: '{{base_url}}/api/v1/admin/canned-responses/:templateId'
order: 4000
pathVariables:
  - key: templateId
    value: '{{canned_response_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shortcut": "greet-v2",
      "content": "Hi there! How may I help you today?"
    }
