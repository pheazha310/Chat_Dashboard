$kind: http-request
name: 'Close Escalation'
method: PATCH
url: '{{base_url}}/api/v1/admin/escalations/:escalationId'
order: 3000
pathVariables:
  - key: escalationId
    value: '{{escalation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "resolution": "Issue resolved by supervisor."
    }
