$kind: http-request
name: 'Create Escalation'
method: POST
url: '{{base_url}}/api/v1/admin/conversations/:id/escalations'
order: 2000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Customer requires supervisor assistance.",
      "priority": "high"
    }
