$kind: http-request
name: 'Create Note'
method: POST
url: '{{base_url}}/api/v1/admin/conversations/:id/notes'
order: 2000
pathVariables:
  - key: id
    value: '{{conversation_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "Internal note about this conversation.",
      "mentions": []
    }
