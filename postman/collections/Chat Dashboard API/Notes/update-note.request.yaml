$kind: http-request
name: 'Update Note'
method: PATCH
url: '{{base_url}}/api/v1/admin/notes/:noteId'
order: 3000
pathVariables:
  - key: noteId
    value: '{{note_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "Updated note content."
    }
