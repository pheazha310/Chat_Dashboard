$kind: http-request
name: 'Forward Message'
method: POST
url: '{{base_url}}/api/v1/admin/messages/:messageId/forwards'
order: 7000
pathVariables:
  - key: messageId
    value: '{{message_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "conversationId": "{{conversation_id}}"
    }
