# Postgres 17 + Redis for ONE environment. Its own Compose project (chatdash-<env>-infra), so deploying the app never
# recreates the data stores. No published ports: only containers on the private network can reach them.
# Usage (scripts do this): docker compose -p chatdash-${CHAT_ENV}-infra --env-file .env.<env> -f deployment/compose/infra.yml up -d
name: chatdash-${CHAT_ENV:?set CHAT_ENV}-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases: [chatdash-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pub/Sub carries the realtime events between API slots, so a Redis restart only drops transient events.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redisdata:/data
    networks:
      default:
        aliases: [chatdash-redis]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pgdata:
    name: chatdash_${CHAT_ENV}_pgdata
  redisdata:
    name: chatdash_${CHAT_ENV}_redisdata

networks:
  default:
    name: chatdash_${CHAT_ENV}_net
